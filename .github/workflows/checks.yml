name: Checks

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: touying-greyc-ambrosia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: touying-greyc-ambrosia
      # Test live development integration; release imports remain pinned to 0.1.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: inspiros/touying-ambrosia
          ref: master
          path: touying-ambrosia
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: '0.15.1'
      - name: Install PDF inspection tools and test fonts
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core fonts-dejavu-extra
      - name: Check installers, shared signature, and copied package consumers
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check GREYC branding, header navigation, and appendix integration
        run: python3 -u tests/run.py
